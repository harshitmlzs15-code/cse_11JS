<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event</title>
    <script>
        //without parameters
        function myFunction()
        {
            alert("hello world!");
        }
        //with parameter
        function sayHello (name, age){
            document.write(name + " is " + age + " years old. ");
        }
    </script>
</head>
<body>
    <button onclick= "myFunction()">try it</button>
    <form>
        <input type="button" onclick="sayHello('Harshit', 18)" value="Say hello">
    </form>
</body>
</html>
